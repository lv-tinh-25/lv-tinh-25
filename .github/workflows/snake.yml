name: Generate Snake Animation

on:
  # Tự động chạy mỗi 24 giờ
  schedule:
    - cron: "0 0 * * *"
  
  # Cho phép ấn chạy thủ công trong tab Actions
  workflow_dispatch:
  
  # Chạy mỗi khi bạn push code lên branch main/master
  push:
    branches:
    - main
    - master

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Tạo file svg hoạt ảnh con rắn từ contribution graph của username lv-tinh-25
      - name: generate-github-contribution-grid-snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: lv-tinh-25
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Push file svg đã tạo lên branch output
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-import-endpoint@v2
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
